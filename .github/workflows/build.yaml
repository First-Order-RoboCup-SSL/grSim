name: Build
on:
  push:
    branches:
      - master
  pull_request:
jobs:
  build-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-22.04, ubuntu-24.04 ]
    steps:
      - uses: actions/checkout@v6
      - name: "Select Ubuntu package mirror"
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sed -i 's|http://azure\.archive\.ubuntu\.com/ubuntu|https://mirrors.edge.kernel.org/ubuntu|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list.d/ubuntu.sources
      - name: "Update dependencies"
        run: sudo apt-get update
      - name: "Install dependencies"
        run: sudo apt-get install -y build-essential cmake pkg-config qtbase5-dev libqt5opengl5-dev libgl1-mesa-dev libglu1-mesa-dev libprotobuf-dev protobuf-compiler libode-dev libboost-dev libopenblas-dev xvfb libgl1-mesa-dri
      - name: "Build"
        run: make
      - name: "Build regression tests"
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON -DBUILD_ODE=ON
          cmake --build build -j 2
      - name: "Run regression tests"
        working-directory: build
        run: xvfb-run -a ctest --output-on-failure

  build-macos:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-15, macos-26 ]
    steps:
      - uses: actions/checkout@v6
      - name: "Install dependencies"
        run: brew install cmake pkg-config qt@5
      - name: "Build Apple Silicon application and tests"
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: |
          qt_prefix="$(brew --prefix qt@5)"
          export PATH="$qt_prefix/bin:$PATH"
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$qt_prefix" -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="$MACOSX_DEPLOYMENT_TARGET" \
            -DBUILD_ODE=ON -DBUILD_TESTING=ON -DGRSIM_MACOSX_BUNDLE=ON
          cmake --build build -j 3
      - name: "Run native macOS regressions and OpenGL smoke check"
        env:
          # The shared macOS 26 runner has measured observer pauses >100 ms.
          # Retain the 500 ms silence/missing-feedback negative controls.
          GRSIM_TEST_TIMING_BUDGET_MS: "200"
        run: ctest --test-dir build --output-on-failure
      - name: "Package and run relocated Apple Silicon app"
        if: matrix.os == 'macos-15'
        env:
          MACOSX_DEPLOYMENT_TARGET: "15.0"
        run: bash tests/package_macos.sh build
      - name: "Upload Apple Silicon application"
        if: matrix.os == 'macos-15'
        uses: actions/upload-artifact@v4
        with:
          name: grSim-arm64-${{ matrix.os }}
          path: dist/grSim-macos-arm64-15.0.zip
          if-no-files-found: error

  test-macos-26-download:
    name: Run the macOS 15 download on macOS 26
    needs: build-macos
    runs-on: macos-26
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grSim-arm64-macos-15
          path: artifact
      - name: "Extract and run the shipped application without a build checkout"
        run: |
          mkdir -p "$RUNNER_TEMP/grSim-download"
          ditto -x -k artifact/grSim-macos-arm64-15.0.zip "$RUNNER_TEMP/grSim-download"
          cd "$RUNNER_TEMP/grSim-download"
          unset QT_PLUGIN_PATH QT_QPA_PLATFORM_PLUGIN_PATH QML2_IMPORT_PATH DYLD_LIBRARY_PATH DYLD_FRAMEWORK_PATH
          ./grSim.app/Contents/MacOS/grSim --smoke-test

